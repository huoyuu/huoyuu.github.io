baseURL = "https://huoyuu.top/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "活鱼的小天地"
copyright = "huoyutianxia"
theme = "stack"

[params]
  mainSections = ["posts"]
  featuredImageField = "cover.image"
  defaultFeaturedImage = ""
  rssFullContent = true

  [params.footer]
    since = 2026

  [params.sidebar]
    avatar = "img/avatar.jpg"

  [params.dateFormat]
  published = "2006-01-02 15:04"
  lastUpdated = "2006-01-02 15:04"

  [params.article]
    math = false
    toc = true
    readingTime = false

[markup.highlight]
  style = "dracula"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions]
  passthrough = { enabled = true, delimiters = { block = [], inline = [] } }

[menus]
  [[menus.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
    [menus.main.params]
      icon = "home"
  [[menus.main]]
    identifier = "posts"
    name = "日记"
    url = "/posts/"
    weight = 2
    [menus.main.params]
      icon = "hash"
  [[menus.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 3
    [menus.main.params]
      icon = "archives"
  [[menus.main]]
    identifier = "about"
    name = "关于本站"
    url = "/about/"
    weight = 5
    [menus.main.params]
      icon = "user"
  [[menus.main]]
    identifier = "changelog"
    name = "更新日志"
    url = "/changelog/"
    weight = 6
    [menus.main.params]
      icon = "clock"

