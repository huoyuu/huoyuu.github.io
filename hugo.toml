baseURL = "https://huoyuu.top/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "活鱼的小天地"
copyright = "huoyutianxia"
theme = "stack"

[params]
  mainSections = ["posts"]
  featuredImageField = "cover.image"
  defaultFeaturedImage = ""
  rssFullContent = true

  [params.footer]
    since = 2026

  [params.sidebar]
    subtitle = "记录学习笔记、技术心得与生活随想"
    avatar = "img/avatar.jpg"

  [params.dateFormat]
  published = "2006-01-02 15:04"
  lastUpdated = "2006-01-02 15:04"

  [params.article]
    math = false
    toc = true
    readingTime = true

[markup.highlight]
  style = "dracula"

[markup.goldmark.extensions]
  passthrough = { enabled = true, delimiters = { block = [], inline = [] } }

[menus]
  [[menus.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
    [menus.main.params]
      icon = "home"
  [[menus.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 3
    [menus.main.params]
      icon = "archives"
  [[menus.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 4
    [menus.main.params]
      icon = "search"
  [[menus.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 5
    [menus.main.params]
      icon = "user"

  [[menus.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/huoyuu"
    weight = 1
    [menus.social.params]
      icon = "brand-github"
      newTab = true
  [[menus.social]]
    identifier = "email"
    name = "Email"
    url = "mailto:huoyutianxia@gmail.com"
    weight = 2
    [menus.social.params]
      icon = "user"
