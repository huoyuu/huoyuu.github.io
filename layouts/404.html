{{ define "body-class" }}template-404{{ end }}
{{ define "main" }}
<section class="hi-404">
    <p class="hi-404__code">404</p>
    <h1 class="hi-404__title">这条鱼游丢了</h1>
    <p class="hi-404__desc">你要找的页面不存在，可能已经被移走或者改了名字。</p>
    <div class="hi-actions hi-404__actions">
        <a class="hi-btn hi-btn--primary" href="{{ "/" | relLangURL }}">回首页</a>
        <a class="hi-btn" href="{{ "/posts/" | relLangURL }}">看看文章</a>
        <a class="hi-btn" href="{{ "/archives/" | relLangURL }}">翻翻归档</a>
    </div>
</section>

{{ partialCached "footer/footer" . }}
{{ end }}
