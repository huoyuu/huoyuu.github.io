media:
  name: images
  label: 图片库
  input: static/img
  output: /img

content:
  - name: posts
    label: 文章
    type: collection
    path: content/posts
    format: toml-frontmatter
    filename: "post-{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      primary: title
      secondary: date
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 发布时间（点日历图标选择日期时间）
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: draft
        label: 草稿（勾选后前台不显示）
        type: boolean
        default: false
      - name: archived
        label: 归档（勾选后显示在「归档」页）
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text

  - name: about
    label: 关于本站
    type: file
    path: content/page/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: 标题
        type: string
      - name: layout
        label: 布局
        type: string
        default: page
      - name: url
        label: URL
        type: string
        default: about
      - name: date
        label: 创建时间
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: lastmod
        label: 最后修改
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: body
        label: 内容
        type: rich-text
