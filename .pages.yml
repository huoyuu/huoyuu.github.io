media:
  name: images
  label: 图片库
  input: static/img
  output: /img

content:
  - name: posts
    label: 文章
    type: collection
    path: content/posts
    format: toml-frontmatter
    view:
      primary: title
      secondary: date
    fields:
      - name: title
        label: 标题
        type: string
      - name: date
        label: 发布时间
        type: datetime
      - name: draft
        label: 草稿
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text

  - name: about
    label: 关于本站
    type: file
    path: content/page/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: 标题
        type: string
      - name: layout
        label: 布局
        type: string
        default: page
      - name: url
        label: URL
        type: string
        default: about
      - name: date
        label: 创建时间
        type: datetime
      - name: lastmod
        label: 最后修改
        type: datetime
      - name: body
        label: 内容
        type: rich-text
